# Local dependencies for development and for `go test` against real services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gogame
      POSTGRES_PASSWORD: gogame
      POSTGRES_DB: gogame
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogame"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
