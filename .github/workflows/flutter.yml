name: flutter

on:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'assets/**', 'android/**', 'backend/internal/goban/testdata/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'assets/**', 'android/**', 'backend/internal/goban/testdata/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/flutter.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
